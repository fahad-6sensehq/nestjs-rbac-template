version: '3.8'

networks:
  test_network:
    external: false

volumes:
  redis-data:

services:
  redis:
    image: redis:8.2-rc1-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    networks:
      - test_network
